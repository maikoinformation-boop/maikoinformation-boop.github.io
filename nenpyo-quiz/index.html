<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>三国年表クイズ ― 日本史・世界史・韓国史</title>
<style>
:root{
  --jp:#d6484f; --jp-bg:#fdecec; --jp-bg2:#fbdadb;
  --kr:#2f6fbf; --kr-bg:#e9f1fb; --kr-bg2:#d7e6f7;
  --wd:#3f9153; --wd-bg:#eaf6ec; --wd-bg2:#d7eedb;
  --ink:#2b2b33; --sub:#767685; --line:#e6e3e8;
  --bg:#faf9fb; --card:#ffffff; --accent:#7a5cf0;
  --radius:16px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.7; -webkit-tap-highlight-color:transparent;
  padding-bottom:24px;
}
.app{max-width:520px;margin:0 auto;}
header.top{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding:14px 16px 0; border-bottom:1px solid var(--line);
}
h1{font-size:16px; font-weight:800; margin:0 0 10px; text-align:center; letter-spacing:.02em;}
h1 small{display:block; font-size:11px; font-weight:600; color:var(--sub); margin-top:2px;}
.tabs{display:flex; gap:6px; padding-bottom:10px;}
.tab-btn{
  flex:1; padding:10px 4px; border:none; border-radius:12px 12px 0 0; background:transparent;
  font-size:14px; font-weight:700; color:var(--sub); cursor:pointer;
}
.tab-btn.active{background:var(--card); color:var(--accent); box-shadow:0 -2px 0 var(--accent) inset;}
main{padding:14px 14px 40px;}
.view{display:none;}
.view.active{display:block;}

.legend{display:flex; gap:8px; margin-bottom:12px; font-size:11px; flex-wrap:wrap;}
.legend span{display:inline-flex; align-items:center; gap:4px; padding:4px 9px; border-radius:999px; font-weight:700;}
.legend .l-jp{background:var(--jp-bg); color:var(--jp);}
.legend .l-kr{background:var(--kr-bg); color:var(--kr);}
.legend .l-wd{background:var(--wd-bg); color:var(--wd);}

.era-card{
  background:var(--card); border-radius:var(--radius); margin-bottom:12px; overflow:hidden;
  box-shadow:0 1px 3px rgba(20,10,40,.06); border:1px solid var(--line);
}
.era-head{
  padding:8px 14px; font-size:12px; font-weight:800; color:#fff;
  background:linear-gradient(90deg,var(--accent),#a084f7);
}
.era-cols{display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px; background:var(--line);}
.col{background:var(--card); padding:10px 8px; display:flex; flex-direction:column; gap:6px;}
.col.jp{background:var(--jp-bg);}
.col.kr{background:var(--kr-bg);}
.col.wd{background:var(--wd-bg);}
.col-badge{
  display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
  border-radius:50%; color:#fff; font-size:11px; font-weight:800; flex-shrink:0;
}
.col.jp .col-badge{background:var(--jp);}
.col.kr .col-badge{background:var(--kr);}
.col.wd .col-badge{background:var(--wd);}
.col-period{font-size:10px; color:var(--sub); font-weight:700; margin-top:2px;}
.event-btn{
  appearance:none; border:none; background:rgba(255,255,255,.6); text-align:left; padding:7px 8px;
  border-radius:9px; font-size:12.5px; line-height:1.5; color:var(--ink); font-family:inherit;
  cursor:pointer; font-weight:600;
}
.col.jp .event-btn:active{background:var(--jp-bg2);}
.col.kr .event-btn:active{background:var(--kr-bg2);}
.col.wd .event-btn:active{background:var(--wd-bg2);}

/* modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(30,20,45,.5); z-index:100; display:none;
  align-items:flex-end; justify-content:center;
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:#fff; width:100%; max-width:520px; border-radius:20px 20px 0 0; padding:22px 20px 28px;
  max-height:82vh; overflow-y:auto; animation:slideup .22s ease-out;
}
@keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-era{font-size:12px; font-weight:800; color:var(--accent); margin-bottom:10px;}
.modal-row{display:flex; gap:8px; align-items:flex-start; padding:8px 10px; border-radius:10px; margin-bottom:6px; font-size:13.5px;}
.modal-row.jp{background:var(--jp-bg);} .modal-row.kr{background:var(--kr-bg);} .modal-row.wd{background:var(--wd-bg);}
.modal-row b{flex-shrink:0; font-size:11px; padding:2px 7px; border-radius:6px; color:#fff;}
.modal-row.jp b{background:var(--jp);} .modal-row.kr b{background:var(--kr);} .modal-row.wd b{background:var(--wd);}
.modal-link{margin-top:14px; padding:14px; border-radius:12px; background:#f4f1fc; font-size:13.5px; font-weight:600;}
.modal-link .tag{display:block; font-size:10.5px; font-weight:800; color:var(--accent); margin-bottom:6px; letter-spacing:.05em;}
.modal-close{
  display:block; width:100%; margin-top:18px; padding:12px; border:none; border-radius:12px;
  background:var(--accent); color:#fff; font-weight:800; font-size:14px; font-family:inherit; cursor:pointer;
}

/* quiz */
.quiz-card{background:var(--card); border-radius:var(--radius); padding:20px 18px; border:1px solid var(--line); box-shadow:0 1px 3px rgba(20,10,40,.06);}
.quiz-progress{font-size:11px; color:var(--sub); font-weight:700; margin-bottom:10px; display:flex; justify-content:space-between;}
.lock-box{text-align:center; padding:36px 14px;}
.lock-emoji{font-size:40px; margin-bottom:12px;}
.lock-title{font-size:16px; font-weight:800; margin-bottom:6px;}
.lock-sub{font-size:13px; color:var(--sub);}
.q-tag{display:inline-block; font-size:11px; font-weight:800; color:#fff; background:var(--accent); padding:4px 10px; border-radius:999px; margin-bottom:12px;}
.q-prompt{font-size:15px; font-weight:800; margin-bottom:12px;}
.q-subject{
  padding:14px; border-radius:12px; font-size:15px; font-weight:700; margin-bottom:16px; text-align:center;
}
.q-subject.jp{background:var(--jp-bg); color:var(--jp);}
.q-subject.kr{background:var(--kr-bg); color:var(--kr);}
.q-subject.wd{background:var(--wd-bg); color:var(--wd);}
.q-subject.era{background:#f1edfb; color:var(--accent);}
.opt-list{display:flex; flex-direction:column; gap:9px;}
.opt-btn{
  text-align:left; padding:13px 14px; border-radius:12px; border:2px solid var(--line); background:#fff;
  font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; color:var(--ink);
}
.opt-btn:active{background:#f5f3fa;}
.opt-btn.correct{border-color:var(--wd); background:var(--wd-bg); color:#1f5c2c;}
.opt-btn.wrong{border-color:var(--jp); background:var(--jp-bg); color:#8f2a2f;}
.opt-btn:disabled{cursor:default;}
.result-banner{text-align:center; font-weight:800; font-size:16px; padding:10px; border-radius:10px; margin-bottom:14px;}
.result-banner.ok{background:var(--wd-bg); color:#1f5c2c;}
.result-banner.ng{background:var(--jp-bg); color:#8f2a2f;}
.done-box{text-align:center; padding:30px 10px;}
.done-emoji{font-size:44px;}
.stat-row{display:flex; justify-content:center; gap:18px; margin:16px 0; font-size:13px;}
.stat-num{font-size:22px; font-weight:800; color:var(--accent); display:block;}
.restart-btn{
  margin-top:10px; padding:11px 18px; border:none; border-radius:12px; background:var(--accent); color:#fff;
  font-weight:800; font-size:13px; font-family:inherit; cursor:pointer;
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>三国年表クイズ<small>日本史・世界史・韓国史を並べて学ぶ</small></h1>
    <div class="tabs">
      <button class="tab-btn active" data-tab="timeline">年表</button>
      <button class="tab-btn" data-tab="quiz">1日1問クイズ</button>
    </div>
  </header>
  <main>
    <section id="view-timeline" class="view active">
      <div class="legend">
        <span class="l-jp">🇯🇵 日本史</span>
        <span class="l-kr">🇰🇷 韓国・朝鮮史</span>
        <span class="l-wd">🌍 世界史</span>
      </div>
      <div id="timeline-list"></div>
    </section>
    <section id="view-quiz" class="view">
      <div id="quiz-area"></div>
    </section>
  </main>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box" id="modal-box"></div>
</div>

/* ---------- utilities ---------- */
function pad2(n){return n<10?'0'+n:''+n;}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function yesterdayStr(){
  const d = new Date(); d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

    card.innerHTML = `
      <div class="era-head">${row.era}</div>
      <div class="era-cols">
        <div class="col jp">
          <span class="col-badge">日</span>
          <span class="col-period">${row.japan.period}</span>
          <button class="event-btn" data-id="${row.id}">${row.japan.event}</button>
        </div>
        <div class="col wd">
          <span class="col-badge">世</span>
          <span class="col-period">世界</span>
          <button class="event-btn" data-id="${row.id}">${row.world.event}</button>
        </div>
        <div class="col kr">
          <span class="col-badge">韓</span>
          <span class="col-period">${row.korea.period}</span>
          <button class="event-btn" data-id="${row.id}">${row.korea.event}</button>
        </div>
      </div>`;
    frag.appendChild(card);
  });
  list.appendChild(frag);
  list.addEventListener('click', e=>{
    const btn = e.target.closest('.event-btn');
    if(!btn) return;
    openConnectionModal(parseInt(btn.dataset.id,10));
  });
}

function openConnectionModal(id){
  const row = DATA.find(r=>r.id===id);
  const box = document.getElementById('modal-box');
  box.innerHTML = `
    <div class="modal-era">${row.era}</div>
    <div class="modal-row jp"><b>日本</b><span>${row.japan.event}</span></div>
    <div class="modal-row wd"><b>世界</b><span>${row.world.event}</span></div>
    <div class="modal-row kr"><b>韓国</b><span>${row.korea.event}</span></div>
    <div class="modal-link"><span class="tag">三つの歴史のつながり</span>${row.connection}</div>
    <button class="modal-close" id="modal-close-btn">閉じる</button>`;
  document.getElementById('modal').classList.add('show');
  document.getElementById('modal-close-btn').onclick = closeModal;
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click', e=>{
  if(e.target.id==='modal') closeModal();
});

/* ---------- tabs ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='quiz') renderQuiz();
  });
});

/* ---------- quiz state ---------- */
const STORAGE_KEY = 'nenpyoQuizState_v1';
function loadState(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(STORAGE_KEY)); }catch(e){}
  if(!s){
    s = {
      phase:'main', mainIndex:0, wrongIds:[], reviewQueue:[],
      pending:null, todayRecord:null,
      stats:{totalAnswered:0,totalCorrect:0,streakDays:0,lastStreakDate:null}
    };
  }
  return s;
}
function saveState(s){ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

function getHourStatus(){
  const h = new Date().getHours();
  if(h<19) return 'before';
  if(h>=23) return 'after';
  return 'open';
}

function currentTargetRow(state){
  if(state.phase==='main'){
    if(state.mainIndex >= DATA.length){
      if(state.wrongIds.length>0){
        state.phase='review';
        state.reviewQueue = state.wrongIds.slice();
        state.wrongIds = [];
      } else {
        state.phase='done';
        return null;
      }
    } else {
      return DATA[state.mainIndex];
    }
  }
  if(state.phase==='review'){
    if(state.reviewQueue.length===0){ state.phase='done'; return null; }
    return DATA[state.reviewQueue[0]];
  }
  return null;
}

function buildQuestion(row){
  const patterns = ['event2era','event2country','era2event'];
  const patternType = pick(patterns);
  const cats = ['japan','korea','world'];
  const catLabel = {japan:'日本史', korea:'韓国・朝鮮史', world:'世界史'};
  const catClass = {japan:'jp', korea:'kr', world:'wd'};

  if(patternType==='event2era'){
    const cat = pick(cats);
    const eventText = row[cat].event;
    const others = shuffle(DATA.filter(r=>r.id!==row.id && r.era!==row.era));
    const distractors = [];
    for(const r of others){ if(distractors.length>=3) break; if(!distractors.includes(r.era)) distractors.push(r.era); }
    const options = shuffle([row.era, ...distractors]);
    return {
      patternType, cat, catClass:catClass[cat],
      prompt:'次の出来事が起きたのはいつごろ？',
      subjectLabel: catLabel[cat],
      subjectText: eventText,
      options, correctText: row.era, id: row.id
    };
  }
  if(patternType==='event2country'){
    const cat = pick(cats);
    const eventText = row[cat].event;
    const options = shuffle(['日本史','韓国・朝鮮史','世界史']);
    return {
      patternType, cat, catClass:'era',
      prompt:'次の出来事は、どの歴史の出来事？',
      subjectLabel: '出来事（' + row.era + '）',
      subjectText: eventText,
      options, correctText: catLabel[cat], id: row.id
    };
  }
  // era2event
  const cat = pick(cats);
  const others = shuffle(DATA.filter(r=>r.id!==row.id));
  const distractors = [];
  for(const r of others){ if(distractors.length>=3) break; const t=r[cat].event; if(t!==row[cat].event && !distractors.includes(t)) distractors.push(t); }
  const options = shuffle([row[cat].event, ...distractors]);
  return {
    patternType, cat, catClass:'era',
    prompt: '「' + row.era + '」ごろに起きた' + catLabel[cat] + 'の出来事は？',
    subjectLabel: '年代',
    subjectText: row.era,
    options, correctText: row[cat].event, id: row.id
  };
}

function renderQuiz(){
  const area = document.getElementById('quiz-area');
  const state = loadState();
  const today = todayStr();

  if(state.todayRecord && state.todayRecord.date===today){
    renderTodayResult(area, state, state.todayRecord);
    return;
  }

  const row = currentTargetRow(state);
  saveState(state);
  if(!row){
    renderDone(area, state);
    return;
  }

  const hourStatus = getHourStatus();
  if(hourStatus!=='open'){
    renderLocked(area, state, hourStatus);
    return;
  }

  if(!state.pending || state.pending.date!==today || state.pending.rowId!==row.id){
    const q = buildQuestion(row);
    state.pending = Object.assign({date:today, rowId:row.id, phaseAtAsk: state.phase}, q);
    saveState(state);
  }
  renderQuestion(area, state);
}

function progressLabel(state){
  const doneMain = Math.min(state.mainIndex, DATA.length);
  if(state.phase==='main') return `年表 ${doneMain}/${DATA.length}問`;
  if(state.phase==='review') return `復習モード（残り${state.reviewQueue.length}問）`;
  return '全問学習済み';
}

function renderLocked(area, state, hourStatus){
  const msg = hourStatus==='before'
    ? {emoji:'🌙', title:'19時から挑戦できます', sub:'今日の1問は 19:00〜23:00 の間だけ挑戦できます。少し待っていてね。'}
    : {emoji:'🌃', title:'今日の挑戦時間は終わりました', sub:'また明日 19:00 になったら次の問題に挑戦できます。'};
  area.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-progress"><span>${progressLabel(state)}</span><span>${state.stats.streakDays}日連続</span></div>
      <div class="lock-box">
        <div class="lock-emoji">${msg.emoji}</div>
        <div class="lock-title">${msg.title}</div>
        <div class="lock-sub">${msg.sub}</div>
      </div>
    </div>`;
}

function renderQuestion(area, state){
  const q = state.pending;
  area.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-progress"><span>${progressLabel(state)}</span><span>${state.stats.streakDays}日連続</span></div>
      <span class="q-tag">${q.subjectLabel}</span>
      <div class="q-prompt">${q.prompt}</div>
      <div class="q-subject ${q.catClass}">${q.subjectText}</div>
      <div class="opt-list" id="opt-list"></div>
    </div>`;
  const list = area.querySelector('#opt-list');
  q.options.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.textContent = opt;
    b.onclick = ()=>answerQuestion(opt);
    list.appendChild(b);
  });
}

function answerQuestion(selected){
  const state = loadState();
  const q = state.pending;
  if(!q) return;
  const correct = selected === q.correctText;
  const row = DATA.find(r=>r.id===q.id);

  if(q.phaseAtAsk==='main'){
    if(!correct) state.wrongIds.push(q.id);
    state.mainIndex += 1;
  } else if(q.phaseAtAsk==='review'){
    state.reviewQueue.shift();
    if(!correct) state.reviewQueue.push(q.id);
  }

  const today = todayStr();
  state.stats.totalAnswered += 1;
  if(correct) state.stats.totalCorrect += 1;
  if(state.stats.lastStreakDate===yesterdayStr()) state.stats.streakDays += 1;
  else if(state.stats.lastStreakDate!==today) state.stats.streakDays = 1;
  state.stats.lastStreakDate = today;

  state.todayRecord = {
    date:today, correct, selected,
    correctText:q.correctText, prompt:q.prompt,
    subjectLabel:q.subjectLabel, subjectText:q.subjectText,
    era:row.era, connection:row.connection,
    japan:row.japan.event, korea:row.korea.event, world:row.world.event
  };
  state.pending = null;
  saveState(state);
  renderQuiz();
}

function renderTodayResult(area, state, rec){
  area.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-progress"><span>${progressLabel(state)}</span><span>${state.stats.streakDays}日連続</span></div>
      <div class="result-banner ${rec.correct?'ok':'ng'}">${rec.correct?'⭕ 正解！':'❌ 残念、不正解'}</div>
      <span class="q-tag">${rec.subjectLabel}</span>
      <div class="q-prompt">${rec.prompt}</div>
      <div class="q-subject era">${rec.subjectText}</div>
      <div class="modal-row" style="background:#f1edfb;margin-top:10px;"><b style="background:var(--accent)">正解</b><span>${rec.correctText}</span></div>
      <div class="modal-link"><span class="tag">三つの歴史のつながり（${rec.era}）</span>${rec.connection}</div>
      <div class="lock-sub" style="text-align:center;margin-top:14px;">今日の挑戦はここまで。また明日 19:00 に次の問題が挑戦できます。</div>
    </div>`;
}

function renderDone(area, state){
  area.innerHTML = `
    <div class="quiz-card done-box">
      <div class="done-emoji">🎉</div>
      <div class="lock-title">全113問クリア！</div>
      <div class="lock-sub">原始時代から1945年まで、3つの歴史を毎日コツコツ学びました。</div>
      <div class="stat-row">
        <div><span class="stat-num">${state.stats.totalAnswered}</span>回答数</div>
        <div><span class="stat-num">${state.stats.totalCorrect}</span>正解数</div>
        <div><span class="stat-num">${state.stats.streakDays}</span>連続日数</div>
      </div>
      <button class="restart-btn" id="restart-btn">もう一度最初から挑戦する</button>
    </div>`;
  document.getElementById('restart-btn').onclick = ()=>{
    if(confirm('進捗をリセットして最初の問題からやり直します。よろしいですか？')){
      localStorage.removeItem(STORAGE_KEY);
      renderQuiz();
    }
  };
}

renderTimeline();
